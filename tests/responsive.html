<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Euroteams responsive QA</title><style>body{margin:0;background:#dfe4ea;font:14px system-ui;color:#172638}header{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{padding:10px;border:1px solid #bac4cf;border-radius:6px;background:white;cursor:pointer}iframe{display:block;border:1px solid #b5c0ca;margin:0 auto 24px;background:white;max-width:none}#frame{width:390px;height:844px}</style><header><strong>Responsive viewport QA</strong><button data-width="320" data-height="740">Mobile 320</button><button data-width="430" data-height="932">Mobile 430</button><button data-width="844" data-height="390">Landscape 844</button><button data-width="1024" data-height="768">Tablet 1024</button><button data-width="390" data-height="844">Mobile 390</button><button data-width="375" data-height="812">Mobile 375</button><button data-width="768" data-height="1024">Tablet 768</button><button data-width="1280" data-height="900">Laptop 1280</button><button data-width="1600" data-height="1000">Desktop 1600</button><span id="size">390 × 844</span></header><iframe id="frame" title="Calculator viewport" src="../index.html"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.getElementById('frame');f.style.width=b.dataset.width+'px';f.style.height=b.dataset.height+'px';document.getElementById('size').textContent=b.dataset.width+' × '+b.dataset.height})</script></html>
