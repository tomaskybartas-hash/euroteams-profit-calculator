name: Workforce Worker Collector Tests

on:
  push:
    branches: [workforce-worker-collector-v1]
    paths: ['collector/**','tests/test_worker_collector.py','tests/test_import_pipeline.py','tests/test_source_registry.py','tests/test_runtime_install.py','tests/test_collector_route_contract.py','.github/workflows/worker-collector-tests.yml']
  pull_request:
    paths: ['collector/**','tests/test_worker_collector.py','tests/test_import_pipeline.py','tests/test_source_registry.py','tests/test_runtime_install.py','tests/test_collector_route_contract.py']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile collector
        run: python -m compileall -q collector
      - name: Run collector tests
        run: python -m pytest -q tests/test_worker_collector.py tests/test_import_pipeline.py tests/test_source_registry.py tests/test_runtime_install.py tests/test_collector_route_contract.py
