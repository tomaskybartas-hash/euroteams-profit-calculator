name: Free worker source refresh
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/free-worker-source-refresh.yml']
permissions: {}
concurrency:
  group: free-worker-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh bounded public jobseeker sources
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 1 --retry-all-errors --retry-delay 20 --max-time 240 https://euroteams-workforce-collector-preview.onrender.com/collector/free-source/refresh --output source-result.json
          python - <<'PY'
          import json
          with open('source-result.json') as source_file:
              result = json.load(source_file)
          print(result)
          if result.get('status') != 'COMPLETED':
              raise SystemExit('Public RSS refresh failed; inspect the source status')
          for key in ('public_jobseekers', 'romanian_jobseekers'):
              source = result.get(key)
              if not source:
                  print(f'::warning::{key}: no operational result returned')
              elif source.get('state') not in ('COMPLETED',):
                  print(f'::warning::{key}: {source.get("state", "UNKNOWN")} {source.get("error", "")}')
          PY
