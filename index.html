<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Euroteams Profit Calculator</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7}iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<iframe id="appFrame" src="app.html" title="Euroteams Profit Calculator"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d) return;
  const style=d.createElement('style');
  style.textContent='.logo-circle{overflow:hidden!important;background:transparent!important;color:transparent!important}.logo-circle img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}';
  d.head.appendChild(style);
  d.querySelectorAll('.logo-circle').forEach(el=>{el.innerHTML='<img src="logo.svg" alt="Euroteams Group logo">';});
});
</script>
</body>
</html>
